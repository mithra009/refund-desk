# docker compose up --build
# refund-desk: http://localhost:8000   risk-service: http://localhost:8001   postgres: localhost:5432
x-db-url: &db-url postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/refund_desk

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: refund_desk
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d refund_desk"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:                       # one-shot: schema, demo customers, policy embeddings
    build: .
    command: ["python", "-c", "from backend_sim.db import get_db; from backend_sim.seed import seed_demo; from app.retrieval import index_to_db; d=get_db(); seed_demo(d); index_to_db(d); print('seeded')"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  risk-service:
    build: .
    command: ["uvicorn", "risk_service.serve:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: *db-url
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      RISK_PUBLIC_HOST: risk-service        # the agent card advertises this host to A2A clients
      RISK_PORT: "8001"
      RISK_MODEL: ${RISK_MODEL:-gemini-3.1-flash-lite-preview}
    ports: ["8001:8001"]
    depends_on:
      seed: {condition: service_completed_successfully}

  refund-desk:
    build: .
    environment:
      DATABASE_URL: *db-url
      CHECKPOINT_DSN: *db-url
      REFUND_DESK_RISK_SERVICE_URL: http://risk-service:8001
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-refund-desk}
      REVIEWER_TOKEN: ${REVIEWER_TOKEN}
      REFUND_DESK_PROMPT_VERSION: ${REFUND_DESK_PROMPT_VERSION:-local}
      REFUND_DESK_GIT_SHA: ${GIT_SHA:-dev}
    ports: ["8000:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
      risk-service: {condition: service_started}

volumes:
  pgdata:
