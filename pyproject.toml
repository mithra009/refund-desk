[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []          # dependencies only; the services run from source via PYTHONPATH

[project]
name = "refund-desk"
version = "0.1.0"
description = "Autonomous refund-request resolver: LangGraph workflow + Google ADK risk service (all models: Gemini)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0",
  "langchain>=1.0,<2",
  "langchain-google-genai>=4.4",
  "langchain-core>=1.0",
  "langsmith>=0.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sse-starlette>=2.1",
  "httpx>=0.28",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
risk = [
  "google-adk[a2a]>=2.14,<3",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "langgraph-checkpoint-sqlite>=2.0",   # durability test: same interrupt/resume mechanics without a server
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = [".", "services/refund_desk", "services"]
testpaths = ["services/refund_desk/tests", "services/risk_service/tests", "evals/tests", "backend_sim/tests"]
markers = ["e2e: needs docker compose stack", "live: needs real model API keys"]
